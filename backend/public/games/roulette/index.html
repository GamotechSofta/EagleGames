<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Roulette</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --gold: #eab308;
      --green: #15803d;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--panel);
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    header span.player-id {
      word-break: break-all;
      color: var(--muted);
      font-size: 11px;
      max-width: 55vw;
      text-align: right;
    }
    a.back {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas#wheel {
      width: min(92vw, 320px);
      height: min(92vw, 320px);
      border-radius: 50%;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .result {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--gold);
      min-height: 2rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      border: 2px solid var(--gold);
      border-radius: 999px;
      padding: 8px 14px;
      background: #334155;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .chip.active {
      background: var(--gold);
      color: #0f172a;
    }
    .bet-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-height: 120px;
      overflow-y: auto;
      padding: 4px;
    }
    .num {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }
    .num.red { background: #b91c1c; color: #fff; }
    .num.black { background: #171717; color: #fff; }
    .num.green { background: var(--green); color: #fff; }
    .num.picked { outline: 3px solid var(--gold); }
    .spin-btn {
      margin-top: 8px;
      width: 100%;
      max-width: 280px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #22c55e, #15803d);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bank {
      font-size: 14px;
      color: var(--muted);
    }
    .bank strong { color: var(--gold); }
    .hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 320px; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="javascript:history.back()">← Back</a>
    <span class="player-id" id="playerLabel">Player: —</span>
  </header>
  <div class="stage">
    <canvas id="wheel" width="320" height="320" aria-label="Roulette wheel"></canvas>
    <div class="result" id="result"></div>
    <p class="bank">Bankroll: <strong id="bank">1000</strong> · Bet: <strong id="betAmt">1</strong> on <strong id="pickLabel">—</strong></p>
    <div class="chips" id="chips"></div>
    <p class="hint">Pick a chip, tap a number (0–36), then Spin. Straight-up pays 35:1.</p>
    <div class="bet-row" id="nums"></div>
    <button type="button" class="spin-btn" id="spinBtn">Spin</button>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const player = params.get('player') || 'guest';
  document.getElementById('playerLabel').textContent = 'Player: ' + player;

  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const numsEl = document.getElementById('nums');
  for (let n = 0; n <= 36; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'num ' + (n === 0 ? 'green' : RED.has(n) ? 'red' : 'black');
    b.textContent = n;
    b.dataset.n = n;
    numsEl.appendChild(b);
  }

  const chipValues = [1, 5, 10, 100];
  let chip = 1;
  const chipsEl = document.getElementById('chips');
  chipValues.forEach((v) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (v === chip ? ' active' : '');
    c.textContent = '₹' + v;
    c.onclick = () => {
      chip = v;
      chipsEl.querySelectorAll('.chip').forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      document.getElementById('betAmt').textContent = String(chip);
    };
    chipsEl.appendChild(c);
  });

  let picked = null;
  numsEl.addEventListener('click', (e) => {
    const t = e.target.closest('.num');
    if (!t) return;
    picked = parseInt(t.dataset.n, 10);
    numsEl.querySelectorAll('.num').forEach((x) => x.classList.remove('picked'));
    t.classList.add('picked');
    document.getElementById('pickLabel').textContent = String(picked);
  });

  let bank = 1000;
  const bankEl = document.getElementById('bank');
  const resultEl = document.getElementById('result');
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  let spinning = false;
  let angle = 0;

  function drawWheel(highlightIndex) {
    const r = canvas.width / 2;
    const order = [
      0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
    ];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(angle);
    const slot = (Math.PI * 2) / 37;
    for (let i = 0; i < 37; i++) {
      const n = order[i];
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r - 8, i * slot, (i + 1) * slot);
      let fill = n === 0 ? '#15803d' : RED.has(n) ? '#b91c1c' : '#171717';
      if (highlightIndex === i) fill = '#fbbf24';
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(r, r);
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.moveTo(-10, -r + 4);
    ctx.lineTo(10, -r + 4);
    ctx.lineTo(0, -r + 28);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function spinToIndex(targetIndex) {
    const slot = (Math.PI * 2) / 37;
    const order = [
      0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
    ];
    const turns = 5 + Math.random() * 3;
    const targetAngle = turns * Math.PI * 2 + (targetIndex + 0.5) * slot;
    const start = angle;
    const startTime = performance.now();
    const duration = 3200;
    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      angle = start + targetAngle * ease;
      drawWheel(null);
      if (t < 1) requestAnimationFrame(frame);
      else {
        spinning = false;
        spinBtn.disabled = false;
        drawWheel(targetIndex);
      }
    }
    requestAnimationFrame(frame);
  }

  drawWheel(null);

  spinBtn.onclick = () => {
    if (spinning) return;
    if (picked === null) {
      resultEl.textContent = 'Pick a number first';
      return;
    }
    if (bank < chip) {
      resultEl.textContent = 'Not enough bankroll';
      return;
    }
    bank -= chip;
    bankEl.textContent = String(bank);
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = '';
    const land = Math.floor(Math.random() * 37);
    const order = [
      0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
    ];
    const idx = order.indexOf(land);
    spinToIndex(idx >= 0 ? idx : 0);
    setTimeout(() => {
      resultEl.textContent = 'Ball on ' + land;
      if (land === picked) {
        const win = chip * 35;
        bank += win + chip;
        resultEl.textContent += ' — You win ₹' + win + '!';
      } else {
        resultEl.textContent += ' — Try again';
      }
      bankEl.textContent = String(bank);
    }, 3300);
  };
})();
  </script>
</body>
</html>
